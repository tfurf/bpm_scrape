# Example values for home network deployment without ingress
replicaCount: 1

image:
  repository: bpm-scrape
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: NodePort
  port: 5000
  nodePort: 30500

ingress:
  enabled: false

persistence:
  enabled: true
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 2Gi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  NODE_ENV: "production"
  PORT: "5000"
